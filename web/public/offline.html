<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#222831">
<title>Nutrikal</title>
<style>
  html,body{margin:0;height:100%;background:#222831;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:8px 0 0}
  p{margin:0;color:#c6cdd9;font-size:14px;max-width:340px;line-height:1.5}
  button{margin-top:12px;min-height:44px;padding:0 24px;border:0;border-radius:2px;background:#7bc74d;color:#222831;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <img src="/app/icon-192.png" alt="">
  <h1>Няма връзка с интернет</h1>
  <p>Приложението ще продължи, щом телефонът се свърже отново.</p>
  <p lang="en">No internet connection. The app continues as soon as the phone is back online.</p>
  <button type="button" onclick="location.reload()">Опитай пак · Try again</button>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
